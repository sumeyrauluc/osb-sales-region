<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {

	}
.leaflet-popup-pane,
.leaflet-control {

.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {

	}

.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {

	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {

	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;

	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {

	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;

	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {

	}
.leaflet-bar a:first-child {

	}
.leaflet-bar a:last-child {

	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;

	}
.leaflet-touch .leaflet-bar a:last-child {

	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;

	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {

.leaflet-retina .leaflet-control-layers-toggle {

	}
.leaflet-touch .leaflet-control-layers-toggle {

	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {

	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {

	}

.leaflet-control-layers-scrollbar {

	}
.leaflet-control-layers label {

	}
.leaflet-control-layers-separator {

	margin: 5px -10px 5px -6px;
	}

/* Default icon URLs */
.leaflet-default-icon-path { /* used only in path-guessing heuristic, see L.Icon.Default */
	background-image: url(images/marker-icon.png);
	}


/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;

.leaflet-control-attribution,
.leaflet-control-scale-line {

.leaflet-control-attribution a {

.leaflet-control-attribution a:hover,

.leaflet-attribution-flag {

	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;

.leaflet-bottom .leaflet-control-scale {

	}
.leaflet-control-scale-line {

	white-space: nowrap;

.leaflet-control-scale-line:not(:first-child) {

	border-bottom: none;

	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {

	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;
	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;
	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;
	line-height: 1.3;
	font-size: 13px;
	font-size: 1.08333em;

	}
.leaflet-popup-content p {

	}
.leaflet-popup-tip-container {
	width: 40px;
	height: 20px;
	position: absolute;

	margin-top: -1px;

	overflow: hidden;

	}
.leaflet-popup-tip {
	width: 17px;
	height: 17px;
	padding: 1px;

	margin: -10px auto 0;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
	background: white;

	box-shadow: 0 3px 14px rgba(0,0,0,0.4);
	}
.leaflet-container a.leaflet-popup-close-button {
	position: absolute;

	}
.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {

	}
.leaflet-popup-scrolled {
	overflow: auto;
	}

.leaflet-oldie .leaflet-popup-content-wrapper {
	-ms-zoom: 1;
	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;
	margin: 0 auto;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);
	}

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,
.leaflet-oldie .leaflet-popup-tip {

	}


/* div icon */

.leaflet-div-icon {
	background: #fff;
	border: 1px solid #666;
	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;

	}
.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;
	pointer-events: auto;
	}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;
	border-top-color: #fff;
	}
.leaflet-tooltip-bottom:before {
	top: 0;
	margin-top: -12px;
	margin-left: -6px;
	border-bottom-color: #fff;
	}
.leaflet-tooltip-left {
	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	top: 50%;
	margin-top: -6px;
	}
.leaflet-tooltip-left:before {

.leaflet-tooltip-right:before {

<style>
:root{
  --ink:#1f2430; --ink2:#4a5263; --mut:#8a92a3; --line:#e7e9ee; --soft:#f4f5f8;
  --panel:#fff; --acc:#F5B400; --acc-ink:#3a2c00; --danger:#d64545; --ok:#1e9e6a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:#eef1f5;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
#app{display:flex;height:100vh}

/* ---------- Sidebar ---------- */
#side{width:372px;flex:none;background:var(--panel);display:flex;flex-direction:column;box-shadow:2px 0 22px rgba(20,24,35,.10);z-index:1000;position:relative}
.brand{display:flex;gap:12px;align-items:center;padding:18px 20px 12px;background:var(--ink);color:#fff}
.logo{width:42px;height:42px;border-radius:12px;background:var(--acc);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:12px;color:#aab1c0}
.tabs{display:flex;gap:4px;padding:8px 12px 0;background:var(--ink)}
.tabs button{flex:1;border:0;background:transparent;color:#aab1c0;padding:10px 8px;font-weight:600;font-size:13px;border-radius:10px 10px 0 0;cursor:pointer}
.tabs button:hover{color:#fff}
.tabs button.on{background:var(--panel);color:var(--ink)}
#sideBody{flex:1;overflow:auto;padding:16px 16px 22px}
#sideFoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#fbfbfc}
#saveState{font-size:11px;color:var(--mut);width:100%;padding:0 2px 2px}
.warnbar{display:block;background:#fff4cc;color:#7a5a00;border-radius:8px;padding:7px 9px;line-height:1.45;font-size:11.5px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font-weight:600;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--soft);border-color:#d6d9e0}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{background:#ffc21a}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#2c3242}
.btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn svg{flex:none}
.icon-btn{border:0;background:transparent;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--mut);flex:none}
.icon-btn:hover{background:#eceef2;color:var(--danger)}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.sec-head h2{font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
.count{background:var(--soft);color:var(--ink2);border-radius:20px;padding:1px 8px;font-size:12px;font-weight:600}

.progress{background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.progress .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:8px}
.progress .lbl b{color:var(--ink)}
.bar{height:8px;border-radius:8px;background:#e3e6ec;overflow:hidden;display:flex}
.bar span{display:block;height:100%}

.rcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--r,12px);padding:12px;margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.rcard:hover{border-color:#d4d8e0;box-shadow:0 6px 18px rgba(20,24,35,.07)}
.rcard .chip{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.rcard .main{flex:1;min-width:0}
.rcard .rname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .rrep{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;align-items:center;gap:4px}
.rcard .stats{text-align:right;font-size:11px;color:var(--mut);line-height:1.5;flex:none}
.rcard .stats b{color:var(--ink);font-size:13px}

.empty{text-align:center;padding:28px 18px;border:1.5px dashed #dcdfe6;border-radius:14px;color:var(--ink2);background:#fcfcfd}
.empty h3{margin:10px 0 6px;font-size:15px;color:var(--ink)}
.empty p{margin:0 0 14px;font-size:13px;line-height:1.5}

.back{border:0;background:none;color:var(--ink2);font-weight:600;cursor:pointer;padding:4px 0;margin-bottom:10px;display:flex;align-items:center;gap:4px;font-size:13px}
.back:hover{color:var(--ink)}
.dhead{border-radius:14px;padding:16px;color:#fff;background:var(--c);position:relative;overflow:hidden;margin-bottom:14px}
.dhead:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12)}
.dhead h2{margin:0;font-size:19px;position:relative}
.dhead .rep{margin-top:6px;font-size:13px;opacity:.95;display:flex;align-items:center;gap:6px;position:relative}
.dhead .acts{display:flex;gap:6px;margin-top:12px;position:relative}
.dhead .acts .btn{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}
.dhead .acts .btn:hover{background:rgba(255,255,255,.3)}

.block{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.bhead{display:flex;align-items:center;justify-content:space-between;padding:11px 12px 11px 14px;background:#fbfbfc;border-bottom:1px solid var(--line);gap:8px}
.bhead h3{margin:0;font-size:13px;display:flex;align-items:center;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:9px 8px 9px 14px;border-bottom:1px solid #f0f1f4;cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:#fafbfc}
.item .dot{width:10px;height:10px;border-radius:3px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{font-size:12.5px;color:var(--mut);padding:12px 14px;line-height:1.5}

.search{position:relative;margin-bottom:12px}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:10px;background:var(--soft);outline:none}
.search input:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(245,180,0,.18)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut)}
.grp{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 2px 6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:20px;padding:2px 8px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.pill.none{background:var(--soft);color:var(--mut)}
.badge{font-size:10px;font-weight:700;background:#fff4cc;color:#7a5a00;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.note{font-size:11.5px;color:var(--mut);line-height:1.5;margin-top:14px;padding:10px 12px;background:var(--soft);border-radius:10px}

/* ---------- Map ---------- */
#mapwrap{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#eef3f8 0%,#dfe7ef 60%,#d5dee8 100%)}
.leaflet-container{font-family:inherit}
.leaflet-control-zoom a{width:34px!important;height:34px!important;line-height:34px!important;color:var(--ink)!important}
.leaflet-bar{border:0!important;box-shadow:0 4px 14px rgba(20,24,35,.14)!important;border-radius:10px!important;overflow:hidden}
.leaflet-control-attribution{background:rgba(255,255,255,.7)!important;font-size:10px}
.m-draw .leaflet-container,.m-draw .leaflet-interactive{cursor:crosshair!important}
.m-draw .card-tip{display:none}
.m-assign .leaflet-interactive{cursor:copy!important}
.pop-open .card-tip{display:none}

.lbl-ilce span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#a1978a;text-shadow:0 0 3px #fbf8f3,0 0 3px #fbf8f3,0 0 3px #fbf8f3}
.lbl-osb span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:11px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.92);padding:2px 7px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.15);border-left:3px solid var(--c)}
.lbl-area span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:11px;font-style:italic;font-weight:600;color:var(--c);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}

.mapbtns{position:absolute;top:14px;left:14px;z-index:800;display:flex;gap:6px}
.mapbtns .btn{box-shadow:0 4px 14px rgba(20,24,35,.12);border-color:transparent}
#legend{position:absolute;left:14px;bottom:18px;z-index:800;background:rgba(255,255,255,.96);border-radius:12px;box-shadow:0 6px 20px rgba(20,24,35,.14);padding:10px 12px;max-width:260px;max-height:40vh;overflow:auto;font-size:12px}
#legend h4{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
#legend .lg{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
#legend .lg:hover b{text-decoration:underline}
#legend .sw{width:12px;height:12px;border-radius:4px;flex:none}
#legend .lg span:last-child{margin-left:auto;color:var(--mut);padding-left:8px}
#legend .sw.un{background:repeating-linear-gradient(45deg,#c3c9d4 0 3px,#e3e6ec 3px 6px);border:1px dashed #7c8595}

#banner{position:absolute;top:14px;left:50%;transform:translate(-50%,-160px);opacity:0;visibility:hidden;z-index:900;background:var(--ink);color:#fff;border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(20,24,35,.3);transition:transform .25s ease,opacity .2s;max-width:calc(100% - 140px)}
#banner.show{transform:translate(-50%,0);opacity:1;visibility:visible}
#banner .txt{font-size:13px;line-height:1.4}
#banner .txt b{color:var(--acc)}
#banner .btns{display:flex;gap:6px;flex:none}
#banner .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
#banner .btn:hover{background:rgba(255,255,255,.22)}
#banner .btn.primary{background:var(--acc);color:var(--acc-ink)}
#banner .pulse{width:10px;height:10px;border-radius:50%;background:var(--acc);flex:none;box-shadow:0 0 0 0 rgba(245,180,0,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(245,180,0,0)}100%{box-shadow:0 0 0 0 rgba(245,180,0,0)}}

#toast{position:absolute;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;z-index:950;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;transition:all .25s;pointer-events:none;box-shadow:0 10px 24px rgba(20,24,35,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.warn{background:#b54708}

/* ---------- Tooltip / popup card ---------- */
.leaflet-tooltip.card-tip{padding:0;border:0;border-radius:12px;box-shadow:0 12px 32px rgba(20,24,35,.2);background:#fff;white-space:normal;color:var(--ink)}
.leaflet-tooltip.card-tip:before{display:none}
.card-pop .leaflet-popup-content-wrapper{padding:0;border-radius:12px;box-shadow:0 12px 32px rgba(20,24,35,.22)}
.card-pop .leaflet-popup-content{margin:0;width:auto!important;line-height:1.4}
.card-pop a.leaflet-popup-close-button{top:8px;right:6px;color:var(--mut)}
.tip{min-width:170px;max-width:250px;padding:11px 13px 10px;border-top:5px solid var(--c,#9aa3b2);border-radius:12px;font-size:12.5px}
.tip-k{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.tip-t{font-size:14px;font-weight:700;margin:2px 0 8px;padding-right:14px;line-height:1.25}
.tip-region{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:9px;padding:7px 10px;font-size:13px}
.tip-region .sw{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.tip-region b{font-size:13.5px}
.tip-rep{display:flex;align-items:center;gap:6px;margin:8px 2px 0;font-size:13px;font-weight:600}
.tip-rep small{color:var(--mut)}
.tip-sec{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:10px 2px 4px}
.tip ul{margin:0;padding:0;list-style:none}
.tip li{padding:3px 2px;display:flex;align-items:center;gap:7px}
.tip li:before{content:"";width:6px;height:6px;border-radius:2px;background:var(--c);flex:none}
.tip li.ar:before{background:transparent;border:1.5px dashed var(--c);width:5px;height:5px}
.tip li.cur{font-weight:700}
.tip li em{color:var(--mut);font-style:normal;font-size:11.5px}
.tip-empty{color:var(--mut);background:var(--soft);border-radius:9px;padding:9px 10px}
.tip-none{color:var(--mut);padding:2px}
.tip-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.tip-acts .lbl{width:100%;font-size:11px;color:var(--mut)}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;background:rgba(20,24,35,.45);display:none;align-items:center;justify-content:center;z-index:5000;padding:16px;backdrop-filter:blur(2px)}
#modal.show{display:flex}
.dlg{background:#fff;border-radius:16px;width:420px;max-width:100%;box-shadow:0 30px 60px rgba(0,0,0,.3);overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.dlg h3{margin:0;padding:18px 20px 4px;font-size:17px}
.dlg .desc{padding:0 20px;color:var(--ink2);font-size:13px;line-height:1.5}
.dlg form{padding:12px 20px 0}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.fld input[type=text],.fld input[type=tel],.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid #dcdfe6;border-radius:9px;outline:none;background:#fff}
.fld textarea{resize:vertical;min-height:60px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(245,180,0,.2)}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.swatches label{margin:0;cursor:pointer}
.swatches input{display:none}
.swatches span{display:block;width:28px;height:28px;border-radius:8px;border:3px solid #fff;box-shadow:0 0 0 1px #dcdfe6}
.swatches input:checked+span{box-shadow:0 0 0 2px var(--ink)}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px 18px}
.btn.del{background:var(--danger);border-color:var(--danger);color:#fff}

.pick{width:100%;justify-content:center;padding:10px;margin-bottom:12px}
.tag{font-size:10px;font-weight:700;background:var(--soft);color:var(--ink2);border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.item.sub{padding-left:32px}
.item .dot.il{border-radius:50%}
.ro .edit-only,.ro [data-act="import-json"],.ro [data-act="share"]{display:none!important}
.m-draw #map{touch-action:none}
.m-draw .leaflet-tooltip{display:none}
.lbl-il span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#aea493;text-shadow:0 0 3px #f6f3ec,0 0 3px #f6f3ec}
details.more{margin-top:14px}
details.more summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:8px 2px}
details.more summary::-webkit-details-marker{display:none}
details.more summary:before{content:"▸";font-size:11px;transition:transform .15s}
details.more[open] summary:before{transform:rotate(90deg)}
details.more summary small{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink2)}
#pdfview{position:fixed;inset:0;z-index:4000;background:#2b303b;display:flex;flex-direction:column}
#pdfview[hidden]{display:none}
.pv-bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--ink);color:#fff;flex-wrap:wrap}
.pv-bar b{font-size:15px;margin-right:4px}
.pv-bar label{font-size:12px;color:#aab1c0;display:flex;align-items:center;gap:6px}
.pv-bar select{background:#2c3242;color:#fff;border:1px solid #3a4152;border-radius:8px;padding:6px 8px;max-width:260px}
.pv-bar .sp{flex:1}
.pv-bar .btn:not(.primary){background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
.pv-bar .btn:disabled{opacity:.6;cursor:wait}
.pv-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.pv-page{position:relative;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.45);flex:none}
.pv-page canvas{position:absolute;inset:0;width:100%;height:100%}
.pv-page input,.pv-page textarea{position:absolute;margin:0;border:1.5px dashed #d5d9e1;background:transparent;outline:none;font-family:"Segoe UI","Segoe UI Variable Text",system-ui,sans-serif;color:#1f2430;border-radius:4px;resize:none;box-sizing:border-box}
.pv-page input{font-weight:700;padding:0 4px}
.pv-page textarea{padding:2px 4px;line-height:1.4}
.pv-page input:hover,.pv-page textarea:hover{border-color:#aab1c0}
.pv-page input:focus,.pv-page textarea:focus{border-color:var(--acc);background:rgba(245,180,0,.06)}
.pv-hint{color:#aab1c0;font-size:12px;text-align:center;padding:0 0 12px}
.pv-hint b{color:#fff}
@media (max-width:760px){
  #app{flex-direction:column-reverse}
  #side{width:100%;height:46vh}
  #legend{display:none}
  #banner{max-width:calc(100% - 24px);flex-wrap:wrap}
}
</style>
</head>
<body>
<script id="seed" type="application/json">null</script>
<div id="app">
  <aside id="side">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#1f2430" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17V10h5.5l3 4.5V17"/><path d="M3 10V6h4l1.5 4"/><path d="M15 3v14h6"/><path d="M15 13h4"/><circle cx="6" cy="18" r="2" fill="#F5B400"/><circle cx="11.5" cy="18" r="2" fill="#F5B400"/></svg>
      </div>
      <div><h1>OSB Satış Bölgeleri</h1><p>Ankara · organize sanayi haritası</p></div>
    </div>
    <nav class="tabs">
      <button data-tab="regions" class="on">Bölgeler</button>
      <button data-tab="osbs">Liste</button>
    </nav>
    <div id="sideBody"></div>
    <div id="sideFoot">
      <div id="saveState">Değişiklikler bu bilgisayarda otomatik kaydedilir</div>
      <button class="btn sm primary" data-act="pdf-open" title="Haritayı ve bölgeleri tek sayfalık PDF olarak hazırla">PDF önizleme</button>
      <button class="btn sm dark" data-act="share" title="Bölgeleriniz içinde gömülü, başka bilgisayarda açılabilen tek dosya">Paylaşım kopyası</button>
      <button class="btn sm" data-act="export-json" title="Tüm bölgeleri dosya olarak indir">⭳ Yedek indir</button>
      <button class="btn sm" data-act="import-json" title="Yedek dosyasından geri yükle">⭱ Yedek yükle</button>
      <button class="btn sm" data-act="export-csv" title="Excel'de açılabilir liste">Excel listesi</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </aside>
  <main id="mapwrap">
    <div id="map"></div>
    <div class="mapbtns">
      <button class="btn sm" data-act="fit-all">Tüm Ankara</button>
      <button class="btn sm" data-act="fit-core">OSB yoğun bölge</button>
      <button class="btn sm" data-act="fit-tr">Türkiye (il il)</button>
    </div>
    <div id="banner"></div>
    <div id="legend"></div>
    <div id="toast"></div>
  </main>
</div>
<div id="modal"></div>
<div id="pdfview" hidden>
  <div class="pv-bar">
    <b>PDF önizleme</b>
    <label>Bölge <select id="pvRegion"></select></label>
    <label>Harita <select id="pvExtent"></select></label>
    <span class="sp"></span>
    <button class="btn primary" data-act="pdf-download">PDF indir</button>
    <button class="btn" data-act="pdf-close">Kapat</button>
  </div>
  <div class="pv-stage"><div class="pv-page" id="pvPage"><canvas id="pvCanvas"></canvas><input id="pvTitle" autocomplete="off" title="Başlığı düzenleyin"><textarea id="pvNotes" placeholder="Buraya not yazabilirsiniz (ör. hedefler, toplantı kararları, iletişim bilgileri)…"></textarea></div></div>
  <div class="pv-hint">Başlığı ve alttaki <b>Notlar</b> alanını doğrudan sayfanın üzerinde düzenleyebilirsiniz. Değişiklikler kaydedilir.</div>
</div>

  for (let i = 0, j = cps.length - 1; i < cps.length; j = i++) area += (cps[j].x + cps[i].x) * (cps[j].y - cps[i].y);
  if (cps.length < 3 || Math.abs(area / 2) < 150) { draw.pts = []; refreshDraw(); toast('Alan çok küçük oldu, tekrar çizin', 'warn'); return; }
  const pts = L.LineUtil.simplify(cps, 1.2).map(p => { const ll = map.containerPointToLatLng(p); return [+ll.lat.toFixed(6), +ll.lng.toFixed(6)]; });
  const cb = draw.onDone;
  stopModes(true);
  const preview = L.polygon(pts, { pane:'draw', interactive:false, color:'#1f2430', weight:2.5, dashArray:'6 5', fillColor:'#F5B400', fillOpacity:.28 }).addTo(map);
  cb(pts, () => map.removeLayer(preview));

  m.classList.add('show');

  const cancel = () => { close(); o.onCancel && o.onCancel(); };
  const submit = () => {
    const v = {}; new FormData(form).forEach((val, k) => v[k] = String(val).trim());
    const req = (o.fields || []).find(fl => fl.required && !v[fl.key]);
    if (req) { form.querySelector('[name="' + req.key + '"]').focus(); return; }
    close(); o.onOk && o.onOk(v);
  };
  m.querySelector('[data-m=ok]').onclick = submit;
  m.querySelector('[data-m=cancel]').onclick = cancel;
  m.onclick = e => { if (e.target === m) cancel(); };
  form.onsubmit = e => { e.preventDefault(); submit(); };

  const first = form.querySelector('input[type=text],input[type=tel],textarea,select'); if (first) setTimeout(() => first.focus(), 30);
}

/* Sayfa A4 yatay, 96 dpi birimleriyle çizilir. Önizleme ve PDF aynı çizim fonksiyonunu kullanır. */
const PAGE = { w:1123, h:794 }, PM = 30;
const PFONT = '"Segoe UI", "Segoe UI Variable Text", system-ui, -apple-system, Roboto, sans-serif';
const BOX = {
  title: { x:PM - 4, y:32, w:680, h:34, fs:22 },

  notesIn: { x:PM + 8, y:662, w:PAGE.w - 2 * PM - 16, h:84, fs:11 }
};
const INK = '#1f2430', INK2 = '#4a5263', MUT = '#8a92a3', LINE = '#e3e6ec';
const pdfOpt = { region:'', extent:'auto' };
const EXTENTS = [['auto','Otomatik'],['ankara','Tüm Ankara'],['tr','Türkiye'],['view','Şu anki harita görünümü']];
const pdfTitle = () => (state.pdf.title || '').trim() || 'Satış Bölgeleri Haritası';

const F = (w, s) => w + ' ' + s + 'px ' + PFONT;
function rr(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function spaced(ctx, px){ if ('letterSpacing' in ctx) ctx.letterSpacing = px + 'px'; }
function wrapLines(ctx, text, maxW){
  const out = [];
  String(text || '').split(/\r?\n/).forEach(par => {
    const words = par.split(/\s+/).filter(Boolean); let cur = '';
    if (!words.length) { out.push(''); return; }
    words.forEach(w => {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width <= maxW) { cur = t; return; }
      if (cur) out.push(cur);
      cur = '';
      for (const ch of w) { if (ctx.measureText(cur + ch).width > maxW && cur) { out.push(cur); cur = ch; } else cur += ch; }
    });
    out.push(cur);
  });
  return out;
}
function ellipsize(ctx, text, maxW){
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text; while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
function pdfRegions(){ const r = pdfOpt.region && regionById(pdfOpt.region); return r ? [r] : state.regions; }

/* Sütun içerikleri: önce ölç, sığmazsa yazıyı küçült, yine sığmazsa kes. */
function columnOps(ctx, build, box){
  for (const fs of [11, 10, 9, 8.2, 7.5]) {
    const res = build(fs);
    if (res.y <= box.y + box.h) return res.ops;
    if (fs === 7.5) {
      const lim = box.y + box.h - 14, ops = res.ops.filter(o => (o.y || 0) <= lim);
      ops.push({ t:'text', text:'… devamı sayfaya sığmadı', font:F('italic 400', 8.5), color:MUT, x:box.x, y:box.y + box.h - 2 });
      return ops;
    }
  }
}
function drawOps(ctx, ops){
  ops.forEach(o => {
    if (o.t === 'text') { ctx.font = o.font; ctx.fillStyle = o.color; spaced(ctx, o.ls || 0); ctx.fillText(o.text, o.x, o.y); spaced(ctx, 0); }
    else if (o.t === 'chip') { rr(ctx, o.x, o.y, o.s, o.s, o.s * .28); ctx.fillStyle = o.color; ctx.fill(); }
    else if (o.t === 'line') { ctx.fillStyle = LINE; ctx.fillRect(o.x, o.y, o.w, 1); }
    else if (o.t === 'tile') {
      rr(ctx, o.x, o.y, o.w, o.h, 8); ctx.fillStyle = '#f4f5f8'; ctx.fill();
      ctx.font = F('700', o.big); ctx.fillStyle = INK; ctx.fillText(o.value, o.x + 10, o.y + o.h * .52);
      ctx.font = F('600', 8.6); ctx.fillStyle = MUT; ctx.fillText(o.label, o.x + 10, o.y + o.h - 9);
    }
  });
}
function leftColumn(ctx){
  const box = BOX.left, regs = pdfRegions();
  return columnOps(ctx, fs => {
    const ops = [], lh = fs * 1.38, x = box.x, w = box.w; let y = box.y + 12;
    ops.push({ t:'text', text:'BÖLGELER VE İÇERİKLERİ', font:F('700', 8.6), color:MUT, x, y, ls:1 }); y += 8;
    if (!regs.length) { y += lh * 1.4; ops.push({ t:'text', text:'Henüz bölge tanımlanmadı.', font:F('400', fs), color:INK2, x, y }); return { ops, y }; }
    regs.forEach((r, i) => {
      y += i ? lh * .7 : lh * .5;
      if (i) { ops.push({ t:'line', x, y, w }); y += lh * .5; }
      y += fs * 1.35;
      ops.push({ t:'chip', x, y:y - fs * 1.02, s:fs * 1.05, color:r.color });

function geoRings(g){ return g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : []; }
function drawMapBox(ctx){

  ILCE.features.forEach(f => zone(f.geometry, regionOfIlce(f.properties.ad), ILCE_BASE));
  IL.features.forEach(f => { pathGeo(f.geometry); ctx.strokeStyle = '#7f8996'; ctx.lineWidth = 1.4; ctx.stroke(); });
  state.regions.forEach(r => r.areas.forEach(a => {
    ctx.beginPath(); a.latlngs.forEach((ll, i) => { const [px, py] = P(ll[0], ll[1]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.closePath();

/* Tek sayfalık, JPEG görüntülü PDF dosyasını elle yazar (dış kütüphane gerekmez). */
function makePdf(jpg, pw, ph){
  const W = 841.89, H = 595.28, enc = s => new TextEncoder().encode(s);
  const parts = [], offs = []; let len = 0;
  const push = b => { parts.push(b); len += b.length; };
  const obj = (n, fn) => { offs[n] = len; push(enc(n + ' 0 obj\n')); fn(); push(enc('\nendobj\n')); };
  push(enc('%PDF-1.4\n')); push(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
  obj(1, () => push(enc('<< /Type /Catalog /Pages 2 0 R >>')));
  obj(2, () => push(enc('<< /Type /Pages /Kids [3 0 R] /Count 1 >>')));
  obj(3, () => push(enc('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W + ' ' + H + '] /Resources << /XObject << /Im0 4 0 R >> /ProcSet [/PDF /ImageC] >> /Contents 5 0 R >>')));
  obj(4, () => { push(enc('<< /Type /XObject /Subtype /Image /Width ' + pw + ' /Height ' + ph + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n')); push(jpg); push(enc('\nendstream')); });
  const cs = 'q ' + W + ' 0 0 ' + H + ' 0 0 cm /Im0 Do Q';
  obj(5, () => push(enc('<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream')));
  const p2 = n => String(n).padStart(2, '0'), d = new Date();
  obj(6, () => push(enc('<< /Producer (OSB Satis Bolgeleri) /CreationDate (D:' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds()) + ') >>')));
  const xref = len;
  let x = 'xref\n0 7\n0000000000 65535 f \n';
  for (let i = 1; i <= 6; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  push(enc(x + 'trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n' + xref + '\n%%EOF\n'));
  return new Blob(parts, { type:'application/pdf' });
}

function regionFields(r){
  return [
    { key:'name', label:'Bölge adı', value:r ? r.name : '', placeholder:'ör. Batı Ankara', required:true },
    { key:'rep', label:'Satışçı', value:r ? r.rep : '', placeholder:'ör. Ahmet Yılmaz' },
    { key:'phone', label:'Telefon (isteğe bağlı)', type:'tel', value:r ? r.phone : '', placeholder:'05xx xxx xx xx' },
    { key:'color', label:'Renk', type:'color', value:r ? r.color : nextColor() }
  ];
}
function pointInLayer(p, layer){
  const ll = layer.getLatLngs(), rings = [].concat(...(Array.isArray(ll[0][0]) ? ll : [ll]));
  let inside = false;
  rings.forEach(ring => { for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const a = ring[i], b = ring[j];
    if (((a.lat > p.lat) !== (b.lat > p.lat)) && (p.lng < (b.lng - a.lng) * (p.lat - a.lat) / (b.lat - a.lat) + a.lng)) inside = !inside;
  }});
  return inside;
}
function guessIlce(latlngs){
  const c = L.polygon(latlngs).getBounds().getCenter(); let best = null;
  for (const ad in ilceLayers) ilceLayers[ad].eachLayer(l => { if (!best && pointInLayer(c, l)) best = ad; });
  return best || ilceNames[0];
}

  'unassign': (id) => { const r = explicitRegionOfOsb(id), o = osbById(id); if (!r) return; r.osbIds = r.osbIds.filter(x => x !== id); save(); refresh(); toast(o.ad + ' bölgeden çıkarıldı'); },
  'unassign-zone': (ad, el) => { const il = el.dataset.kind === 'il', r = il ? regionOfIl(ad) : regionOfIlce(ad); if (!r) return;
    const key = il ? 'iller' : 'ilceler'; r[key] = r[key].filter(x => x !== ad); save(); refresh(); toast(ad + (il ? ' ili' : ' ilçesi') + ' bölgeden çıkarıldı'); },
  'assign-to': (id, el) => { const r = regionById(el.dataset.rid); if (!r) return;
    const kind = el.dataset.kind;
    if (kind === 'ilce' || kind === 'il') { const key = kind === 'il' ? 'iller' : 'ilceler', cur = kind === 'il' ? regionOfIl(id) : regionOfIlce(id);
      if (cur) cur[key] = cur[key].filter(x => x !== id); r[key].push(id); toast(id + ' → ' + r.name); }
    else { const o = osbById(id); if (!o) return; const cur = explicitRegionOfOsb(id); if (cur) cur.osbIds = cur.osbIds.filter(x => x !== id); r.osbIds.push(id); toast(o.ad + ' → ' + r.name); }
    save(); map.closePopup(); refresh(); selectRegion(r.id); },
  'fly-osb': (id) => { const x = osbLayers[id]; if (!x) return; flyTo(x.poly.getBounds(), 14); flash({ osb:id }); },
  'fly-ilce': (ad) => { const l = ilceLayers[ad]; if (!l) return; flyTo(l.getBounds(), 11); flash({ ilce:ad }); },
  'fly-il': (ad) => { const l = ilLayers[ad]; if (!l) return; flyTo(l.getBounds(), 9); flash({ il:ad }); },
  'fly-area': (id) => { const x = areaLayers[id]; if (x) { flyTo(x.l.getBounds(), 15); flash({ area:id }); } },
  'draw-area': () => { const r = regionById(selId); if (!r) return;
    startDraw('<b>' + esc(r.name) + '</b> için müşteri alanı çizin.', (pts, clear) => {
      openForm({ title:'Müşteri alanını adlandır', fields:[{ key:'name', label:'Alan adı', placeholder:'ör. Şaşmaz Sanayi Sitesi', required:true }, { key:'note', label:'Not (isteğe bağlı)', type:'textarea', placeholder:'ör. müşteri adları, adres…' }],
        onOk: v => { clear(); r.areas.push({ id:uid('a'), name:v.name, note:v.note, latlngs:pts }); save(); rebuild(); renderSide(); toast('Müşteri alanı eklendi'); },
        onCancel: () => { clear(); renderSide(); toast('Çizim iptal edildi'); } });
    }); },
  'edit-area': (id) => { const f = findArea(id); if (!f) return;
    openForm({ title:'Müşteri alanını düzenle', fields:[{ key:'name', label:'Alan adı', value:f.a.name, required:true }, { key:'note', label:'Not', type:'textarea', value:f.a.note }],
      onOk: v => { f.a.name = v.name; f.a.note = v.note; save(); rebuild(); renderSide(); } }); },
  'del-area': (id) => { const f = findArea(id); if (!f) return;
    confirmBox('Alan silinsin mi?', '<b>' + esc(f.a.name) + '</b> müşteri alanı silinecek.', 'Sil', () => { f.r.areas = f.r.areas.filter(a => a.id !== id); save(); rebuild(); renderSide(); }); },
  'new-osb': () => startDraw('Listede olmayan OSB\'nin sınırını çizin.', (pts, clear) => {
      openForm({ title:'Yeni OSB', fields:[{ key:'ad', label:'OSB adı', placeholder:'ör. Polatlı OSB', required:true }, { key:'ilce', label:'İlçe', type:'select', options:ilceNames, value:guessIlce(pts) }],
        onOk: v => { clear(); const c = L.polygon(pts).getBounds().getCenter();
          state.extraOsbs.push({ id:uid('u'), ad:v.ad, tamAd:v.ad, ilce:v.ilce, lp:[c.lat, c.lng], geo:L.polygon(pts).toGeoJSON().geometry });
          save(); rebuild(); tab = 'osbs'; renderSide(); toast('OSB eklendi'); },
        onCancel: () => { clear(); renderSide(); toast('Çizim iptal edildi'); } });
    }),
  'del-osb': (id) => { const o = osbById(id); if (!o || !o.custom) return;
    confirmBox('OSB silinsin mi?', '<b>' + esc(o.ad) + '</b> haritadan kaldırılacak.', 'Sil', () => {
      state.extraOsbs = state.extraOsbs.filter(x => x.id !== id); state.regions.forEach(r => r.osbIds = r.osbIds.filter(x => x !== id)); save(); rebuild(); renderSide(); }); },
  'tab-osbs': () => { tab = 'osbs'; renderSide(); },
  'cancel': () => { stopModes(); toast('Çizim iptal edildi'); },
  'fit-all': () => map.flyToBounds(ilBounds, { padding:[20,20], duration:.7 }),
  'fit-core': () => flyTo(coreBounds(), 12),
  'fit-tr': () => map.flyToBounds(trBounds, { padding:[16,16], duration:.8 }),
  'pdf-open': () => openPreview(),
  'pdf-close': () => closePreview(),
  'pdf-download': () => downloadPdf(),
  'share': () => openForm({ title:'Paylaşım kopyası', ok:'Kopyayı indir',
    desc:'Bölgeleriniz dosyanın içine gömülür ve <b>tek bir dosya</b> iner. O dosyayı başka bir bilgisayara kopyalayın ya da gönderin; çift tıklanınca harita sizin bıraktığınız haliyle açılır. İnternet, kurulum ya da sunucu gerekmez.',
    fields:[{ key:'kind', label:'Kopya türü', type:'select', options:[SHARE_RO, SHARE_RW], value:SHARE_RO }],
    onOk: v => { const ro = v.kind !== SHARE_RW, html = buildShare(ro);
      if (!html) { toast('Kopya oluşturulamadı; “Yedek indir” kullanın', 'warn'); return; }
      download(new Blob([html], { type:'text/html;charset=utf-8' }), 'OSB-Satis-Bolgeleri-' + (ro ? 'goruntuleme-' : '') + today() + '.html');
      toast('Paylaşım kopyası indirildi'); } }),
  'export-json': () => { download(new Blob([JSON.stringify(state, null, 2)], { type:'application/json' }), 'satis-bolgeleri-' + today() + '.json'); toast('Yedek indirildi'); },
  'import-json': () => $('#importFile').click(),
  'export-csv': () => {
    const rows = [['Bölge', 'Satışçı', 'Telefon', 'Tür', 'Ad', 'İlçe / Not']];
    state.regions.forEach(r => {
      r.iller.slice().sort(trCmp).forEach(ad => rows.push([r.name, r.rep, r.phone, 'İl', ad, '']));
      r.ilceler.slice().sort(trCmp).forEach(ad => rows.push([r.name, r.rep, r.phone, 'İlçe (Ankara)', ad, '']));
      regionOsbs(r).forEach(x => rows.push([r.name, r.rep, r.phone, 'OSB', x.o.ad, (x.o.ilce || '') + (x.viaIlce ? ' (ilçeyle birlikte)' : '')]));
      r.areas.forEach(a => rows.push([r.name, r.rep, r.phone, 'Müşteri alanı', a.name, a.note]));
    });
    ilceNames.filter(ad => !regionOfIlce(ad)).forEach(ad => rows.push(['(atanmamış)', '', '', 'İlçe (Ankara)', ad, '']));
    allOsbs().filter(o => !regionOfOsb(o.id)).forEach(o => rows.push(['(atanmamış)', '', '', 'OSB', o.ad, o.ilce]));
    const csv = '﻿' + rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
    download(new Blob([csv], { type:'text/csv;charset=utf-8' }), 'satis-bolgeleri-' + today() + '.csv'); toast('Excel listesi indirildi');
  }
};
const EDIT_ACTS = ['new-region','edit-region','del-region','assign','unassign','unassign-zone','assign-to','draw-area','edit-area','del-area','new-osb','del-osb','import-json','share'];

$('#importFile').onchange = async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file || RO) return;
  try {
    const data = JSON.parse(await file.text());
    if (!valid(data)) throw new Error();
    confirmBox('Yedek yüklensin mi?', 'Mevcut bölgelerin yerine dosyadaki <b>' + data.regions.length + ' bölge</b> yüklenecek.', 'Yükle', () => {
      stopModes(true); state = normalize(data); selId = null; save(); rebuild(); renderSide(); toast('Yedek yüklendi'); });
  } catch(_) { toast('Dosya okunamadı. Bu uygulamanın yedek dosyası olduğundan emin olun.', 'warn'); }
};

document.addEventListener('click', e => {
  const tb = e.target.closest('.tabs button');
  if (tb) { tab = tb.dataset.tab; renderSide(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = ACTIONS[b.dataset.act]; if (!fn || (RO && EDIT_ACTS.includes(b.dataset.act))) return;
  e.preventDefault(); e.stopPropagation(); fn(b.dataset.id, b);
});
document.addEventListener('keydown', e => {
  if ($('#modal').classList.contains('show')) { if (e.key === 'Escape') $('#modal [data-m=cancel]').click(); return; }
  if (!$('#pdfview').hidden) { if (e.key === 'Escape') closePreview(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'Escape' && mode !== 'view') { stopModes(); restyle(); }
});

/* ================= Başlat ================= */
map.fitBounds(ilBounds, { padding:[20,20] });
rebuild();
renderSide();
if (RO) $('#saveState').textContent = 'Salt okunur kopya · ' + new Date(seed.exportedAt || Date.now()).toLocaleDateString('tr-TR') + ' tarihli';
else if (seededNow) { if (writeLocal()) $('#saveState').textContent = 'Paylaşım kopyasındaki bölgeler yüklendi'; else markUnsaved(); }
else if (!storageOk) markUnsaved();
window.__app = { get state(){ return state; }, map, ACTIONS, buildShare, RO, renderPage, makePdf, pdfOpt };
})();

</script>
</body>
</html>
